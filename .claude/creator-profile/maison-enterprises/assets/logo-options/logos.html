<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PF;src:url(PlayfairDisplay-Upright.ttf)}
@font-face{font-family:PFI;src:url(PlayfairDisplay-Italic.ttf)}
@font-face{font-family:IB;src:url(Inter-Bold.otf)}
@font-face{font-family:IM;src:url(Inter-Medium.otf)}
@font-face{font-family:IS;src:url(Inter-SemiBold.otf)}
html,body{margin:0;background:#050505}
.c{width:1600px;height:900px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#1a0e05 0%,#050505 65%);position:relative}
.tag{position:absolute;left:48px;top:40px;font:24px IS;color:#FF7A1A;letter-spacing:.2em}
.wa{font:400 150px PF;color:#fff;letter-spacing:.18em;margin-left:.18em;line-height:1}
.rule{width:420px;height:2px;background:#FF7A1A;margin:34px 0 26px}
.sa{font:34px IM;color:#FF7A1A;letter-spacing:.62em;margin-left:.62em}
.row{display:flex;align-items:center;gap:56px}
.wb{font:400 170px PFI;color:#fff;line-height:.9}
.sb{font:30px IM;color:#FF7A1A;letter-spacing:.55em;margin-top:22px;margin-left:8px}
.wc{font:150px IB;color:#fff;letter-spacing:.04em;line-height:.9}
.sc{font:36px IS;color:#FF7A1A;letter-spacing:.48em;margin-top:18px;margin-left:6px}
</style></head><body>
<div class="c" id="a"><div class="tag">OPCIÓN 1 · CLÁSICA</div>
<svg width="300" height="230" viewBox="0 0 300 230" style="margin-bottom:34px">
 <path d="M30 108 L150 22 L270 108" fill="none" stroke="#FF7A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="150" y="222" text-anchor="middle" font-family="PF" font-size="150" fill="#fff">M</text>
</svg>
<div class="wa">MAISON</div><div class="rule"></div><div class="sa">ENTERPRISES</div></div>

<div class="c" id="b"><div class="tag">OPCIÓN 2 · MONOGRAMA</div>
<div class="row">
<svg width="330" height="330" viewBox="0 0 330 330">
 <circle cx="165" cy="165" r="150" fill="none" stroke="#FF7A1A" stroke-width="6"/>
 <circle cx="165" cy="165" r="132" fill="none" stroke="#FF7A1A" stroke-width="1.5" opacity=".6"/>
 <text x="160" y="222" text-anchor="middle" font-family="PFI" font-size="190" fill="#FF7A1A">M</text>
</svg>
<div><div class="wb">Maison</div><div class="sb">ENTERPRISES</div></div></div></div>

<div class="c" id="d"><div class="tag">OPCIÓN 3 · MODERNA</div>
<div class="row">
<svg width="300" height="300" viewBox="0 0 300 300">
 <rect x="0" y="0" width="300" height="300" rx="62" fill="#FF7A1A"/>
 <path d="M52 222 L52 132 L101 88 L150 132 L199 88 L248 132 L248 222" fill="none" stroke="#050505" stroke-width="26" stroke-linejoin="miter" stroke-linecap="butt"/>
 <rect x="137" y="170" width="26" height="52" fill="#050505"/>
</svg>
<div><div class="wc">MAISON</div><div class="sc">ENTERPRISES</div></div></div></div>
</body></html>
